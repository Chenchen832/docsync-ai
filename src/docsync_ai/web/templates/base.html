<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DocSync-AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark">D</span><span>DocSync-AI</span></a>

  </header>

  <footer>DocSync-AI · 代码—文档一致性智能检测工具</footer>
  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>

</html>
